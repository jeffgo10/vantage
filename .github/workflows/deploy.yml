# Deploy RoamVantage to Cloudflare Workers (OpenNext) after merges to master.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN     — API token with Workers Scripts Edit + R2 Edit
#   CLOUDFLARE_ACCOUNT_ID    — Cloudflare account ID
#   GH_PACKAGES_READ_TOKEN   — PAT with read:packages (cross-repo @jeffgo10/panorama-viewer)
#
# Required GitHub repository variables (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_APP_URL              — Worker origin, e.g. https://roamvantage.<account>.workers.dev
#   NEXT_PUBLIC_SUPABASE_URL         — Hosted Supabase project URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY    — Hosted anon (public) key
#
# NEXT_PUBLIC_* are inlined at Next.js build time — keep them in sync with Worker vars/secrets.
# Runtime-only secrets (SUPABASE_SERVICE_ROLE_KEY, etc.) stay on the Worker via `wrangler secret put`.

name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@jeffgo10"

      - name: Configure GitHub Packages
        run: |
          echo "@jeffgo10:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
